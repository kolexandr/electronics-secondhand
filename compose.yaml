x-app: &app
  image: regear-local
  build:
    context: .
    dockerfile: Dockerfile.dev
  environment:
    RAILS_ENV: development
    DB_HOST: mysql
    DB_PORT: 3306
    DB_USERNAME: regear
    DB_PASSWORD: local_app_password
    REDIS_URL: redis://redis:6379/0
  volumes:
    - app_storage:/rails/storage

services:
  setup:
    <<: *app
    command: ["bin/rails", "db:prepare", "db:seed"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["bin/jobs"]
    stop_grace_period: 30s
    depends_on:
      setup:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: regear_development
      MYSQL_USER: regear
      MYSQL_PASSWORD: local_app_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  mysql_data:
  redis_data:
